name: Android Build Final

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install Gradle 8.2.2 manually
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2.2-bin.zip -O gradle-8.2.2-bin.zip
        sudo unzip -q -d /opt/gradle gradle-8.2.2-bin.zip
        echo "/opt/gradle/gradle-8.2.2/bin" >> $GITHUB_PATH

    - name: Build with Gradle 8.2.2
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ride-filter-apk
        path: app/build/outputs/apk/debug/app-debug.apk
